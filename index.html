<head>
<meta charset="utf-8">

<title>万年筆 筆記シミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700&family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: a writing desk. Pen and ink controls in a left column, the sheet of paper on the right.
   Deliberately a single light look: the page is paper. */
:root {
  --desk: #e9e7e1;        /* desk surface */
  --panel: #fbfaf7;
  --ink: #1d2230;         /* UI text */
  --muted: #5d6270;
  --rule: #d7d4cc;
  --accent: #22304f;      /* blue-black */
  --accent-fg: #f6f5f1;
  --gold: #a8842c;        /* nib gold */
  --chip: #f0eee8;
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--desk); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 32px;
}
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 20px; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 3.6vw, 34px); letter-spacing: 0.06em; }
h1 small { font-family: var(--font-mono); font-size: 0.38em; letter-spacing: 0.2em; color: var(--muted); margin-left: 0.8em; font-weight: 400; }
header p { margin: 0; color: var(--muted); max-width: 62ch; }
button.lang { margin-left: auto; align-self: center; font: inherit; font-size: 13px; padding: 6px 12px; min-height: 36px; border: 1px solid var(--rule); border-radius: 999px; background: var(--panel); color: var(--ink); cursor: pointer; }
button.lang:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.main { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 14px; display: grid; gap: 16px; }
.panel h2 { margin: 0 0 6px; font-size: 12px; letter-spacing: 0.16em; color: var(--muted); font-weight: 500; }
.seg { display: grid; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; background: var(--chip); }
.seg.c2 { grid-template-columns: repeat(2, 1fr); } .seg.c3 { grid-template-columns: repeat(3, 1fr); } .seg.c4 { grid-template-columns: repeat(4, 1fr); }
.seg label { cursor: pointer; display: block; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; text-align: center; padding: 6px 4px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font-size: 13px; line-height: 1.3; height: 100%; }
.seg span small { display: block; font-size: 10.5px; color: var(--muted); }
.seg input:checked + span { background: var(--accent); color: var(--accent-fg); }
.seg input:checked + span small { color: inherit; opacity: 0.8; }
.seg input:focus-visible + span { outline: 2px solid var(--gold); outline-offset: -2px; }
.seg label.off { cursor: not-allowed; }
.seg label.off span { color: #b5b2aa; background: repeating-linear-gradient(135deg, transparent 0 5px, rgba(0,0,0,0.035) 5px 6px); }
.seg label.off span b { opacity: 0.35; }
.rules span em { font-style: normal; }
.rules span i { display: block; width: 18px; height: 3px; border-radius: 2px; margin: 3px auto 3px; }
.metal span em { font-style: normal; }
.metal span b { display: block; width: 14px; height: 6px; border-radius: 3px; margin: 2px auto 3px; }
.readout { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.readout b { color: var(--ink); font-weight: 500; }

.inks { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.swatch { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 5px; border: 1px solid var(--rule); border-radius: 999px; background: var(--chip); cursor: pointer; font: inherit; font-size: 12.5px; color: var(--ink); }
.swatch em { font-style: normal; }
.swatch i { width: 16px; height: 16px; border-radius: 50%; display: inline-block; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15); }
.swatch[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.chart { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; margin-top: 4px; }
.chart button { aspect-ratio: 1; border-radius: 4px; border: 1px solid rgba(0,0,0,0.12); cursor: pointer; padding: 0; min-height: 26px; }
.chart button[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
.chart-head { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.chart-head #chart-n { color: var(--ink); }
.chart + .custom, .custom { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.custom input[type=color] { width: 38px; height: 28px; padding: 0; border: 1px solid var(--rule); border-radius: 4px; background: none; }

.ctl { display: grid; gap: 4px; }
.ctl-head { display: flex; justify-content: space-between; align-items: baseline; }
.val { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
input[type=range] { width: 100%; accent-color: var(--accent); }
.note { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button.btn { font: inherit; font-size: 13px; padding: 7px 12px; border: 1px solid var(--rule); border-radius: 4px; background: var(--chip); color: var(--ink); cursor: pointer; min-height: 36px; }
button.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.btn.armed { border-color: #b3261e; color: #b3261e; }
button.btn:focus-visible, .swatch:focus-visible, .chart button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.meter { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; font-size: 12px; color: var(--muted); }
.meter .bar { height: 6px; border-radius: 3px; background: var(--chip); border: 1px solid var(--rule); overflow: hidden; }
.meter .bar i { display: block; height: 100%; width: 100%; background: var(--accent); transition: width 0.15s; }
.meter .bar i.low { background: #b3261e; }
.meter .num { font-family: var(--font-mono); min-width: 3.5em; text-align: right; }
.status { font-size: 12.5px; color: var(--muted); min-height: 1.5em; }

.sheet { display: grid; gap: 10px; min-width: 0; }
@media (min-width: 901px) {
  /* keep the paper in view and use the full window height while the controls scroll */
  .sheet { position: sticky; top: 12px; }
  .paper-wrap { height: calc(100vh - 185px); }
}
.trial { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 12px; display: grid; gap: 4px; }
.trial-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
#trial { display: block; width: 100%; height: 86px; }
.paper-wrap { position: relative; overflow: auto; max-height: calc(100vh - 150px); min-height: 360px; background: #d9d6ce; border-radius: 6px; padding: 12px; }
.paper { position: relative; margin: 0 auto; box-shadow: 0 1px 2px rgba(0,0,0,0.12), 0 8px 24px rgba(0,0,0,0.14); touch-action: none; }
.paper canvas { position: absolute; inset: 0; display: block; }
#live { mix-blend-mode: multiply; }
/* iPad / Apple Pencil: no text selection, loupe, callout or image drag while writing */
.sheet, .paper, .paper * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-user-drag: none; -webkit-tap-highlight-color: transparent; }
body.writing { -webkit-user-select: none; user-select: none; }
.paper-foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); }
@media (max-width: 900px) {
  /* phones and tablets held upright: the paper comes first and stays at the top of the screen,
     the controls scroll underneath it */
  .main { grid-template-columns: minmax(0, 1fr); }
  .sheet { order: -1; position: sticky; top: 0; z-index: 2; background: var(--desk); padding: 6px 0 8px; gap: 6px; }
  .paper-wrap { height: auto; min-height: 0; max-height: 54vh; padding: 8px; }
  .trial { padding: 4px 10px; }
  #trial { height: 52px; }
  .paper-foot span:last-child { display: none; }
  header p { display: none; }
}
@media (max-width: 900px) and (orientation: portrait) and (min-height: 1000px) {
  .paper-wrap { max-height: 62vh; }
}
.paper.pan { touch-action: pan-x pan-y; }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1 data-th="title">万年筆 筆記シミュレーター<small>FOUNTAIN PEN NIB SIMULATOR</small></h1>
    <button type="button" class="lang" id="lang" aria-label="Language">English</button>
    <p data-t="lead">ペン先の地金と字幅を選んで書くと、筆圧によるしなりと線幅の変化、インクの濃淡を再現します。筆圧対応のペンでは実際の筆圧を使います。</p>
  </header>

  <div class="main">
    <aside class="panel" aria-label="ペンとインク" data-ta="a.panel">
      <div>
        <h2 data-t="h.metal">ペン先の地金（硬い → 柔らかい）</h2>
        <div class="seg c3 metal" role="radiogroup" aria-label="ペン先の地金">
          <label><input type="radio" name="metal" value="ss"><span><b style="background:#b9bec4"></b><em data-t="metal.ss">ステンレス</em></span></label>
          <label><input type="radio" name="metal" value="k14" checked><span><b style="background:#c9a64e"></b><em data-t="metal.k14">14金</em></span></label>
          <label><input type="radio" name="metal" value="k18"><span><b style="background:#d4ad48"></b><em data-t="metal.k18">18金</em></span></label>
          <label><input type="radio" name="metal" value="k21"><span><b style="background:#ddb33f"></b><em data-t="metal.k21">21金</em></span></label>
          <label><input type="radio" name="metal" value="k22"><span><b style="background:#e3b836"></b><em data-t="metal.k22">22金</em></span></label>
          <label><input type="radio" name="metal" value="k23"><span><b style="background:#e8bc2e"></b><em data-t="metal.k23">23金</em></span></label>
        </div>
        <p class="note" id="metal-note" data-t="metalNote" hidden>21金・22金・23金は国産のみです（海外製にはありません）。</p>
      </div>

      <div>
        <h2 data-t="h.grade">字幅</h2>
        <div class="seg c4" role="radiogroup" aria-label="字幅" id="grades"></div>
        <div class="seg c2" role="radiogroup" aria-label="国産と海外製" style="margin-top:8px">
          <label><input type="radio" name="origin" value="domestic" checked><span data-th="o.domestic">国産<small>細め</small></span></label>
          <label><input type="radio" name="origin" value="foreign"><span data-th="o.foreign">海外製<small>同じ表記でも太め</small></span></label>
        </div>
        <div class="seg c3" role="radiogroup" aria-label="ペン先の種類" id="cuts" style="margin-top:8px"></div>
        <div class="readout" id="readout"></div>
      </div>

      <div>
        <h2 data-t="h.ink">インク</h2>
        <div class="inks" id="inks"></div>
        <div class="chart-head"><span id="chart-t"></span><span id="chart-n"></span></div>
        <div class="chart" id="chart" aria-label="カラーチャート"></div>
        <label class="custom"><span data-t="custom">その他の色</span><input type="color" id="custom" value="#2f6fd1"></label>
      </div>

      <div class="ctl">
        <div class="ctl-head"><label for="press"><b data-t="press">筆圧（マウス・指で書くとき）</b></label><span class="val" id="press-v"></span></div>
        <input type="range" id="press" min="0.05" max="1" step="0.01" value="0.4">
        <p class="note" id="pen-note"></p>
      </div>

      <div>
        <h2 data-t="h.cond">コンディション</h2>
        <div class="seg c2" role="radiogroup" aria-label="ペンのコンディション" id="conds"></div>
        <div class="ctl" id="cond-ctl" style="margin-top:8px" hidden>
          <div class="ctl-head"><label for="sev"><b id="sev-label">程度</b></label><span class="val" id="sev-v"></span></div>
          <input type="range" id="sev" min="0" max="1" step="0.01" value="0.5">
          <div class="meter" id="meter" hidden>
            <span data-t="m.nib">ペン先</span><span class="bar"><i id="m-wet"></i></span><span class="num" id="m-wet-v"></span>
            <span id="m-tank-l" data-t="m.tank">タンク</span><span class="bar" id="m-tank-b"><i id="m-tank"></i></span><span class="num" id="m-tank-v"></span>
          </div>
          <div class="row" id="refill-row" hidden><button class="btn" type="button" id="refill" data-t="refill">インクを入れ直す</button></div>
          <p class="note" id="cond-note"></p>
        </div>
      </div>

      <div>
        <h2 data-t="h.paper">紙</h2>
        <div class="seg c3" role="radiogroup" aria-label="紙のサイズ">
          <label><input type="radio" name="size" value="a5" checked><span data-t="s.a5">A5 横</span></label>
          <label><input type="radio" name="size" value="a4"><span data-t="s.a4">A4 縦</span></label>
          <label><input type="radio" name="size" value="post"><span data-t="s.post">はがき</span></label>
        </div>
        <div class="seg c3" role="radiogroup" aria-label="紙の種類" style="margin-top:6px">
          <label><input type="radio" name="lines" value="plain"><span data-th="l.plain">白紙</span></label>
          <label><input type="radio" name="lines" value="ruled" checked><span data-th="l.ruled">横罫線<small>7mm</small></span></label>
          <label><input type="radio" name="lines" value="vertical"><span data-th="l.vertical">縦罫線<small>便箋</small></span></label>
          <label><input type="radio" name="lines" value="genko"><span data-th="l.genko">原稿用紙<small>400字</small></span></label>
          <label><input type="radio" name="lines" value="hanshi"><span data-th="l.hanshi">和紙<small>よくにじむ</small></span></label>
        </div>
        <div class="seg c2" role="radiogroup" aria-label="紙の色" style="margin-top:6px">
          <label><input type="radio" name="paper" value="white" checked><span data-t="p.white">白</span></label>
          <label><input type="radio" name="paper" value="cream"><span data-t="p.cream">クリーム</span></label>
        </div>
        <div id="rule-box" style="margin-top:8px">
          <h2 style="margin-bottom:4px" data-t="h.rules">罫線の色</h2>
          <div class="seg c4 rules" role="radiogroup" aria-label="罫線の色" id="rules"></div>
        </div>
      </div>

      <div>
        <h2 data-t="h.view">表示</h2>
        <div class="seg c4" role="radiogroup" aria-label="表示倍率">
          <label><input type="radio" name="zoom" value="fit" checked><span data-t="z.fit">全体</span></label>
          <label><input type="radio" name="zoom" value="1"><span data-t="z.1">実寸</span></label>
          <label><input type="radio" name="zoom" value="2"><span data-t="z.2">2倍</span></label>
          <label><input type="radio" name="zoom" value="4"><span data-t="z.4">4倍</span></label>
        </div>
      </div>

      <div class="row">
        <button class="btn" type="button" id="undo" data-t="undo">元に戻す</button>
        <button class="btn" type="button" id="clear" data-t="clear">全部消す</button>
      </div>
      <div>
        <h2 data-t="h.save">保存</h2>
        <div class="row">
          <button class="btn primary" type="button" data-save="png">PNG</button>
          <button class="btn primary" type="button" data-save="jpg">JPG</button>
          <button class="btn primary" type="button" data-save="pdf" data-t="pdf">PDF（実寸）</button>
        </div>
        <p class="status" id="status"></p>
      </div>
    </aside>

    <section class="sheet" aria-label="紙" data-ta="a.sheet">
      <div class="trial">
        <div class="trial-head"><span data-t="trial">試し書き（筆圧 弱 → 強、3倍表示）</span><span id="trial-v"></span></div>
        <canvas id="trial" role="img" aria-label="選んだペン先で、筆圧を弱から強へ上げながら書いた見本" data-ta="a.trial"></canvas>
      </div>
      <div class="paper-wrap" id="paper-wrap">
        <div class="paper" id="paper">
          <canvas id="base" aria-label="書いた内容" data-ta="a.base"></canvas>
          <canvas id="live" aria-hidden="true"></canvas>
        </div>
      </div>
      <div class="paper-foot"><span id="paper-info"></span><span data-t="foot">線幅は一般的な目安の値です。実物に合わせて調整できます。</span></div>
    </section>
  </div>
</div>

<script src="nib.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const radio = (n) => document.querySelector(`input[name=${n}]:checked`).value;

  // ---------- language ----------
  // Japanese and English UI. Picked from ?lang=, then the viewer's last choice, then the browser language.
  const T = {
    ja: {
      title: '万年筆 筆記シミュレーター<small>FOUNTAIN PEN NIB SIMULATOR</small>', langBtn: 'English',
      lead: 'ペン先の地金と字幅を選んで書くと、筆圧によるしなりと線幅の変化、インクの濃淡を再現します。筆圧対応のペンでは実際の筆圧を使います。',
      'a.panel': 'ペンとインク', 'a.sheet': '紙', 'a.trial': '選んだペン先で、筆圧を弱から強へ上げながら書いた見本', 'a.base': '書いた内容',
      'h.metal': 'ペン先の地金（硬い → 柔らかい）', metalNote: '21金・22金・23金は国産のみです（海外製にはありません）。', metalOff: '海外製にはこの地金のペン先はありません',
      metals: { ss: 'ステンレス', k14: '14金', k18: '18金', k21: '21金', k22: '22金', k23: '23金' },
      'h.grade': '字幅', 'o.domestic': '国産<small>細め</small>', 'o.foreign': '海外製<small>同じ表記でも太め</small>', domestic: '国産', foreign: '海外製',
      cuts: { normal: ['ノーマル', '標準'], stub: ['スタブ', '縦太・横細'], flex: ['フレックス', '筆圧で大きく変化'] },
      readout: (g, cut, o, m, w) => `${g}${cut ? ' ' + cut : ''}（${o}）・${m}　線幅 ${w}`,
      stubRange: (a, b) => `横 ${a} ／ 縦 ${b} mm`, rangeSep: '〜',
      'h.ink': 'インク', inks: { blue: 'ブルー', blueblack: 'ブルーブラック', black: 'ブラック', red: 'レッド' },
      chartTitle: (f) => `カラーチャート：${f}系`, custom: 'その他の色',
      chart: {
        blue: ['ブルー', 'ロイヤルブルー', 'スカイブルー', 'ターコイズブルー', '群青', '紫みのブルー', '紺', 'ブルーグレー'],
        blueblack: ['ブルーブラック', '青みの強い', '明るめ', '黒に近い', '緑み', '紫み', '青灰', '退色した色'],
        black: ['ブラック', '漆黒', '柔らかい黒', '茶みの黒', '青みの黒', '緑みの黒', '赤みの黒', 'チャコールグレー'],
        red: ['レッド', '朱色', '紅', 'オレンジレッド', 'ローズ', '煉瓦色', 'ボルドー', 'ワインレッド'],
      },
      press: '筆圧（マウス・指で書くとき）', penNote: '筆圧対応のペンで書くと、実際の筆圧を使います。', penSeen: 'ペン入力を検出：実際の筆圧で書いています。指では紙を動かせます。',
      'h.cond': 'コンディション',
      conds: { good: ['良好', ''], skip: ['掠れる', 'ランダムに飛ぶ'], starve: ['インクが続かない', '書くうちに薄れる'], empty: ['インク切れ間近', 'やがて書けなくなる'] },
      condNotes: {
        skip: '書き出しや速い線、軽い筆圧で線が飛び、ところどころ乾いた筋になります。',
        starve: '続けて書くとペン先が乾いて薄れ、やがて線が出なくなります。ペンを離すと少しずつ回復します。',
        empty: '書いた量だけタンクが減ります。残りが少なくなると線がかすれて途切れ、最後は書けなくなります。',
      },
      sev: '程度', sevLevels: ['軽い', '中くらい', '重い'], left: '残りのインク', leftLevels: ['多め', '少なめ', 'ほとんどない'],

  // ---------- paper ----------
  const strokes = [];
  let scale = MM, cur = null;
  const base = $('base'), live = $('live'), bg = base.getContext('2d'), lg = live.getContext('2d');
  function paperSize() { return PAPERS[radio('size')]; }

  }

  function redraw() {

  }
  $('rules').innerHTML = Object.entries(RULES).map(([k, v]) => `<label><input type="radio" name="rule" value="${k}"${k === 'std' ? ' checked' : ''}><span><i style="background:${v.c || 'linear-gradient(90deg, rgba(80,110,160,0.7) 50%, rgba(178,74,46,0.8) 50%)'}"></i><em data-t="rule.${k}">${v.label}</em></span></label>`).join('');
  const syncRuleBox = () => { const l = radio('lines'); $('rule-box').hidden = l === 'plain' || l === 'hanshi'; };
  document.querySelectorAll('input[name=lines]').forEach((el) => el.addEventListener('change', syncRuleBox)); syncRuleBox();
  document.querySelectorAll('input[name=size], input[name=zoom], input[name=lines], input[name=paper], input[name=rule]').forEach((el) => el.addEventListener('change', layout));
  window.addEventListener('resize', () => { if (radio('zoom') === 'fit') layout(); });

  // ---------- writing ----------

  const paperEl = $('paper');
  function toMM(e) { const r = paperEl.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; }

    const dpr = live.width / parseFloat(live.style.width);

  let armed = null;
  $('clear').addEventListener('click', () => {

  // ---------- trial stroke: pressure ramps from light to heavy ----------
